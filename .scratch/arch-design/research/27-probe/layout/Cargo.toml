[package]
name = "t27-layout-probe"
version = "0.0.0"
edition = "2024"

[dependencies]
traces = { path = "../../../../../", features = ["test-utils"] }
redb = "=4.3.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2"

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1

[package]
name = "replay-fault-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
traces = { path = "../../../../../", features = ["test-utils"] }
redb = "=4.3.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
blake3 = "1.8.7"
walkdir = "2.5.0"
tempfile = "3.27.0"
rustix = { version = "1.1.5", features = ["fs"] }
libc = "0.2.189"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1

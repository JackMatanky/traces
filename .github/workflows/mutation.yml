---
name: Mutation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Run mutation with --update-baseline and upload the new baseline"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MISE_EXPERIMENTAL: "1"
  MISE_YES: "1"
  MISE_AUTO_INSTALL: "0"
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  mutation:
    name: mutation (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        module: [temporal, index, query, template, config, note, schema]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "mutation-${{ matrix.module }}"
      - run: mise install --locked cargo-binstall github:nextest-rs/nextest cargo:mutarust
      # Gate: fail on any escape absent from mutarust-baseline.json. The
      # baseline holds only the escapes triaged so far, so the gate reports
      # without failing the workflow (continue-on-error) until a manual run
      # with `update_baseline` has committed the baseline for this module.
      - if: inputs.update_baseline != true
        continue-on-error: true
        run: mise run test:mutants -m "${{ matrix.module }}" --fail-on-escaped
      - if: inputs.update_baseline == true
        run: mise run test:mutants -m "${{ matrix.module }}" --update-baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report-${{ matrix.module }}
          path: |
            report.json
            mutarust-report.html
            mutarust-baseline.json
          if-no-files-found: warn

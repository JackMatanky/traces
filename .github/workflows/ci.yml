---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MISE_EXPERIMENTAL: "1"
  MISE_YES: "1"
  MISE_AUTO_INSTALL: "0"
  RUSTUP_AUTO_INSTALL: "0"

# Job names mirror the primary check run by each job.
jobs:
  # -- Compile gates --
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "platform-check-${{ matrix.os }}"
      - run: mise exec -- cargo check --workspace --all-targets --all-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy-ubuntu"
      - run: mise exec -- cargo clippy --workspace --all-targets --all-features -- -D warnings

  visibility:
    name: visibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "visibility-ubuntu"
      - run: mise install --locked cargo-binstall cargo:cargo-public-api
      - run: mise run check:visibility
      - run: mise run check:layers

  # -- Tests --
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: mise install --locked cargo-binstall github:nextest-rs/nextest
      - run: mise run test
      - name: Assert per-target non-empty test counts and exact doctest count
        run: |
          echo "==> Asserting per-target non-empty test counts..."
          lib_count=$(cargo nextest list --all-features -E 'kind(lib)' | grep -c '^traces-pkm ' || true)
          integration_count=$(cargo nextest list --all-features -E 'binary(integration)' | grep -c '^traces-pkm::integration ' || true)
          e2e_count=$(cargo nextest list --all-features -E 'binary(e2e)' | grep -c '^traces-pkm::e2e ' || true)
          echo "Target test counts: lib=${lib_count}, integration=${integration_count}, e2e=${e2e_count}"
          if [[ "${lib_count}" -eq 0 ]]; then
            echo "ERROR: lib target produced 0 tests!" >&2
            exit 1
          fi
          if [[ "${integration_count}" -eq 0 ]]; then
            echo "ERROR: integration target produced 0 tests!" >&2
            exit 1
          fi
          if [[ "${e2e_count}" -eq 0 ]]; then
            echo "ERROR: e2e target produced 0 tests!" >&2
            exit 1
          fi
          echo "==> Asserting exact doctest count (83)..."
          doc_output=$(cargo test --doc --all-features 2>&1)
          echo "${doc_output}"
          total_passed=$(echo "${doc_output}" | grep -o '[0-9]\+ passed' | awk '{s+=$1} END {print s}')
          echo "Total doctests passed: ${total_passed}"
          if [[ "${total_passed}" -ne 83 ]]; then
            echo "ERROR: Expected exactly 83 doctests passed, got ${total_passed}!" >&2
            exit 1
          fi
          echo "==> Silent-green guards passed."

  # -- Repository hygiene & file formats (hk) --
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hk-hygiene"
      - run: mise install --locked cargo-binstall taplo tombi cargo:ryl hk
      - run: mise exec -- hk validate
      - run: >-
          mise exec -- hk check --all --no-fail-fast
          --skip-step cargo-audit
          --skip-step cargo-deny
          --skip-step gitleaks
          --skip-step detect-private-key
          --skip-step cargo-clippy
          --skip-step cargo-test
          --skip-step cargo-doc

  # -- Secret & credential detection --
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise install --locked gitleaks hk
      - run: mise exec -- gitleaks detect --redact --no-banner --log-level error
      - run: mise exec -- hk check --all --no-fail-fast --step detect-private-key

  # -- Dependency vulnerabilities & supply chain (hk) --
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hk-audit"
      - run: mise install --locked cargo-binstall cargo-deny cargo:cargo-audit hk
      - run: mise exec -- hk validate
      - run: >-
          mise exec -- hk check --all --no-fail-fast
          --step cargo-audit
          --step cargo-deny
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: mise run doc

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - id: msrv
        run: |
          # Cargo.toml uses multi-line inline tables (TOML 1.1); tomllib and
          # other strict TOML 1.0 parsers reject them, so extract directly.
          msrv="$(sed -n 's/^rust-version *= *"\([^"]*\)".*$/\1/p' Cargo.toml)"
          if [[ -z "${msrv}" ]]; then
            echo "rust-version not found in Cargo.toml" >&2
            exit 1
          fi
          echo "version=${msrv}" >> "${GITHUB_OUTPUT}"
      - run: mise install "rust@${{ steps.msrv.outputs.version }}"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv-${{ steps.msrv.outputs.version }}"
      - run: mise exec "rust@${{ steps.msrv.outputs.version }}" -- cargo check --workspace --all-features

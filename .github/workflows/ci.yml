---
# Updated CI workflow
name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          override-cargo: true
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

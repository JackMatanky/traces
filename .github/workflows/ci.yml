---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MISE_EXPERIMENTAL: "1"
  MISE_YES: "1"
  MISE_AUTO_INSTALL: "0"
  RUSTUP_AUTO_INSTALL: "0"

# Job names mirror the primary check run by each job.
jobs:
  # -- Compile gates --
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "platform-check-${{ matrix.os }}"
      - run: mise exec -- cargo check --workspace --all-targets --all-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy-ubuntu"
      - run: mise exec -- cargo clippy --workspace --all-targets --all-features -- -D warnings

  visibility:
    name: visibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust uv
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "visibility-ubuntu"
      - run: mise install --locked cargo-binstall cargo:cargo-public-api
      - run: mise run check:visibility
      - run: mise run check:layers

  # -- Tests --
  # Four canonical phases, split by job so a failure is legible in the
  # checks list. Feature configuration per phase mirrors `mise run test`:
  # library and binary units on the production configuration, integration on
  # test-utils; E2E uses the shipped binary; doctests use --all-features.
  # NOTE: the crate has NO `default` feature — never pass `--features
  # default` (hard cargo error); the production configuration is
  # `--no-default-features`.
  test-unit:
    name: test (unit, production config, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-unit-${{ matrix.os }}"
      - run: mise install --locked cargo-binstall github:nextest-rs/nextest
      - run: >-
          cargo nextest run -p traces --no-default-features --no-fail-fast
          --no-tests fail -E 'kind(lib)'
      - run: >-
          cargo nextest run -p traces --no-default-features --no-fail-fast
          --no-tests fail -E 'binary(traces)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-test-unit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: proptest-regressions-${{ matrix.os }}
          path: proptest-regressions/
          if-no-files-found: ignore
  test-integration:
    name: test (integration, test-utils)
    runs-on: ubuntu-latest
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-integration-ubuntu"
      - run: mise install --locked cargo-binstall github:nextest-rs/nextest
      - run: >-
          cargo nextest run -p traces --features test-utils
          --no-tests fail -E 'binary(integration)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-test-integration
          path: target/nextest/ci/junit.xml
  test-e2e:
    name: test (e2e, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Non-Linux E2E unlocked by ticket 09's sandbox environment policy
        # (default-deny table + platform passthrough list).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-e2e-${{ matrix.os }}"
      - run: mise install --locked cargo-binstall github:nextest-rs/nextest
      - run: >-
          cargo nextest run -p traces --all-features
          --no-tests fail --no-fail-fast -E 'binary(e2e) | binary(features)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-test-e2e-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
  test-doctests:
    name: test (doctests, all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-docs-ubuntu"

      - name: Run doctests (require at least one)
        run: |
          set -euo pipefail
          cargo test --doc --all-features 2>&1 | tee "${RUNNER_TEMP}/doctests.log"
          if ! grep -Eq '^test result: ok[.] [1-9][0-9]* passed;' \
            "${RUNNER_TEMP}/doctests.log"; then
            echo "ERROR: No doctests ran." >&2
            exit 1
          fi

  # -- PR mutation diff (production source changes only) --
  mutation-diff:
    name: mutation (changed source)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A large diff can exceed the time box. The job reports but does not block
    # until the nightly baseline exists for every module.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed production source
        id: source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- 'src/'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@v4
        if: steps.source.outputs.changed == 'true'
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        if: steps.source.outputs.changed == 'true'
        with:
          shared-key: "mutation-diff-ubuntu"
      - if: steps.source.outputs.changed == 'true'
        run: mise install --locked cargo-binstall github:nextest-rs/nextest cargo:mutarust
      - name: Gate newly escaped mutations
        if: steps.source.outputs.changed == 'true'
        run: >-
          mise run test:mutants --git-diff
          --git-diff-base "${{ github.event.pull_request.base.sha }}"
          --fail-on-escaped --ignore-msi-with-no-mutations
      - uses: actions/upload-artifact@v7
        if: always() && steps.source.outputs.changed == 'true'
        with:
          name: mutation-diff-report
          path: |
            report.json
            mutarust-report.html
          if-no-files-found: ignore

  # -- Coverage diagnostics; do not enforce a coverage percentage --
  coverage:
    name: coverage (diagnostic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage-ubuntu"
      - run: mise install --locked cargo-binstall github:nextest-rs/nextest cargo:cargo-llvm-cov
      - run: mise run coverage:lcov
      - name: Reject empty coverage reports
        run: |
          if [[ ! -s lcov.info ]] || ! grep -Eq '^LF:[1-9][0-9]*$' lcov.info; then
            echo "ERROR: lcov.info is empty or reports zero lines found." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore

  # -- Repository hygiene & file formats (hk) --
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hk-hygiene"
      - run: mise install --locked cargo-binstall taplo tombi cargo:ryl hk
      - run: mise exec -- hk validate
      - run: >-
          mise exec -- hk check --all --no-fail-fast
          --skip-step cargo-audit
          --skip-step cargo-deny
          --skip-step gitleaks
          --skip-step detect-private-key
          --skip-step cargo-clippy
          --skip-step cargo-test
          --skip-step cargo-doc
          --skip-step visibility
          --skip-step layer-enforcement

  # -- Secret & credential detection --
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise install --locked gitleaks hk
      - run: mise exec -- gitleaks detect --redact --no-banner --log-level error
      - run: mise exec -- hk check --all --no-fail-fast --step detect-private-key

  # -- Dependency vulnerabilities & supply chain (hk) --
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hk-audit"
      - run: mise install --locked cargo-binstall cargo-deny cargo:cargo-audit hk
      - run: mise exec -- hk validate
      - run: >-
          mise exec -- hk check --all --no-fail-fast
          --step cargo-audit
          --step cargo-deny
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: mise run doc

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - id: msrv
        run: |
          # Cargo.toml uses multi-line inline tables (TOML 1.1); tomllib and
          # other strict TOML 1.0 parsers reject them, so extract directly.
          msrv="$(sed -n 's/^rust-version *= *"\([^"]*\)".*$/\1/p' Cargo.toml)"
          if [[ -z "${msrv}" ]]; then
            echo "rust-version not found in Cargo.toml" >&2
            exit 1
          fi
          echo "version=${msrv}" >> "${GITHUB_OUTPUT}"
      - run: mise install "rust@${{ steps.msrv.outputs.version }}"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv-${{ steps.msrv.outputs.version }}"
      - run: mise exec "rust@${{ steps.msrv.outputs.version }}" -- cargo check --workspace --all-features

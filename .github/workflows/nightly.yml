---
name: Nightly quality

on:
  schedule:
    - cron: "0 3 * * *"  # Mutation and fuzz smoke every night.
    - cron: "0 4 * * 0"  # Soak and benchmark smoke every Sunday.
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Run mutation with --update-baseline and upload the new baseline"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MISE_EXPERIMENTAL: "1"
  MISE_YES: "1"
  MISE_AUTO_INSTALL: "0"
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  soak:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * 0'
    name: e2e soak (${{ matrix.os }}, 20 repeats)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NEXTEST_PROFILE: ci-soak
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nightly-soak-${{ matrix.os }}"
      - run: mise install --locked cargo-binstall github:nextest-rs/nextest
      - run: >-
          cargo nextest run -p traces --all-features
          --no-tests fail --no-fail-fast --stress-count 20 -E 'binary(e2e) | binary(features)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-e2e-soak-${{ matrix.os }}
          path: target/nextest/ci-soak/junit.xml
          if-no-files-found: ignore
      - if: always() && matrix.os == 'ubuntu-latest'
        run: mise run bench --mode test

  mutation:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    name: mutation (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        module: [temporal, index, query, template, config, note, schema]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nightly-mutation-${{ matrix.module }}"
      - run: mise install --locked cargo-binstall github:nextest-rs/nextest cargo:mutarust
      # Gate: fail on any escape absent from mutarust-baseline.json. The
      # baseline holds only the escapes triaged so far, so the gate reports
      # without failing the workflow (continue-on-error) until a manual run
      # with `update_baseline` has committed the baseline for this module.
      - if: inputs.update_baseline != true
        continue-on-error: true
        run: mise run test:mutants -m "${{ matrix.module }}" --fail-on-escaped
      - if: inputs.update_baseline == true
        run: mise run test:mutants -m "${{ matrix.module }}" --update-baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report-${{ matrix.module }}
          path: |
            report.json
            mutarust-report.html
            mutarust-baseline.json
          if-no-files-found: ignore

  fuzz-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    name: fuzz (60s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        if: hashFiles('fuzz/**') != ''
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        if: hashFiles('fuzz/**') != ''
        with:
          shared-key: "nightly-fuzz-ubuntu"
      - name: Install cargo-fuzz
        if: hashFiles('fuzz/**') != ''
        run: mise exec -- cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60 seconds
        if: hashFiles('fuzz/**') != ''
        run: |
          for file in fuzz/fuzz_targets/*.rs; do
            [[ -f "$file" ]] || continue
            target="${file##*/}"
            mise exec -- cargo fuzz run "${target%.rs}" -- -max_total_time=60
          done

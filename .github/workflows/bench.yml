---
name: Benchmark smoke

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MISE_EXPERIMENTAL: "1"
  MISE_YES: "1"
  MISE_AUTO_INSTALL: "0"
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  bench-smoke:
    name: benchmarks run (test mode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench-ubuntu"
      - run: mise install --locked cargo-binstall github:nextest-rs/nextest
      - run: mise run bench --mode test
